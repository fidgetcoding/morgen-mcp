name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node --check src/index.js
          node --check src/client.js
          node --check src/tools-events.js
          node --check src/tools-events-schema.js
          node --check src/tools-tasks.js
          node --check src/events-shape.js
          node --check src/calendar-cache.js
          node --check src/validation.js
          node --check bin/setup.js
          bash -n install.sh

      - name: Run tests
        run: npm test
        env:
          MORGEN_API_KEY: test-key-placeholder

      # Natural-language dates depend on the host clock's calendar day, so a
      # suite that only runs in the runner's UTC cannot catch a day-off bug.
      - name: Run tests across timezones
        run: |
          for tz in America/New_York Asia/Dubai Asia/Tokyo America/Los_Angeles Pacific/Auckland; do
            echo "::group::TZ=$tz"
            TZ="$tz" npm test
            echo "::endgroup::"
          done
        env:
          MORGEN_API_KEY: test-key-placeholder
